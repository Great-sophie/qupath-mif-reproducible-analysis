name: QuPath mIF Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run spatial analysis tests
        run: |
          python -m pytest -q \
            src/qupath_mif_day4_spatial/tests/test_spatial.py
